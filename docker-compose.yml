services:
  zm.apigateway.api:
    image: ${DOCKER_REGISTRY-}zmapigatewayapi
    build:
      context: .
      dockerfile: ZM.ApiGateway.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORT=5000
      - ASPNETCORE_HTTPS_PORT=5001
      - ASPNETCORE_URLS=https://0.0.0.0:5000
    ports:
      - "5000:5000"
      - "5001:5001"
    networks:
      - proxybackend   
 
networks:
  proxybackend:
    name: proxybackend
    driver: bridge 