services:
  zm.apigateway.api:
    image: ${DOCKER_REGISTRY-}zmapigatewayapi
    build:
      context: .
      dockerfile: ZM.ApiGateway.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:5000
    ports:
      - "5000:5000"
    networks:
      - proxybackend

  zm.users.api:
    image: ${DOCKER_REGISTRY-}zmusersapi
    build:
      context: .
      dockerfile: ZM.Users.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:5100
    ports:
      - "5100:5100"
    networks:
      proxybackend:
        aliases:
          - users.api

  zm.orders.api:
    image: ${DOCKER_REGISTRY-}zmordersapi
    build:
      context: .
      dockerfile: ZM.Orders.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:5200
    ports:
      - "5200:5200"
    networks:
      proxybackend:
        aliases:
          - orders.api

  zm.payments.api:
    image: ${DOCKER_REGISTRY-}zmpaymentsapi
    build:
      context: .
      dockerfile: ZM.Payments.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:5300
    ports:
      - "5300:5300"
    networks:
      proxybackend:
        aliases:
          - payments.api

networks:
  proxybackend:
    name: proxybackend
    driver: bridge
