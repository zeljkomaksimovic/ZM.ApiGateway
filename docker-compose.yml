services:
  zm.apigateway.api:
    image: ${DOCKER_REGISTRY-}zmapigatewayapi
    build:
      context: .
      dockerfile: ZM.ApiGateway.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORT=5000
      - ASPNETCORE_HTTPS_PORT=5001
      - ASPNETCORE_URLS=https://0.0.0.0:5000
    ports:
      - "5000:5000"
      - "5001:5001"
    networks:
      - proxybackend   
 
  zm.users.api:
    image: ${DOCKER_REGISTRY-}zmusersapi
    build:
      context: .
      dockerfile: services/ZM.Users.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORT=5100
      - ASPNETCORE_HTTPS_PORT=5101
      - ASPNETCORE_URLS=https://0.0.0.0:5100
    ports:
      - "5100:5100"
      - "5101:5101"
    networks:
      - proxybackend
 
  zm.orders.api:
    image: ${DOCKER_REGISTRY-}zmordersapi
    build:
      context: .
      dockerfile: ZM.Orders.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORT=5200
      - ASPNETCORE_HTTPS_PORT=5201
      - ASPNETCORE_URLS=https://0.0.0.0:5200
    ports:
      - "5200:5200"
      - "5201:5201"
    networks:
      - proxybackend
 
  zm.payments.api:
    image: ${DOCKER_REGISTRY-}zmpaymentsapi
    build:
      context: .
      dockerfile: ZM.Payments.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORT=5300
      - ASPNETCORE_HTTPS_PORT=5301
      - ASPNETCORE_URLS=https://0.0.0.0:5300
    ports:
      - "5300:5300"
      - "5301:5301"
    networks:
      - proxybackend
 
networks:
  proxybackend:
    name: proxybackend
    driver: bridge 